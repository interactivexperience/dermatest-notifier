name: Check for new Dermatest studies

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: dermatest-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for new studies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check

      - name: Commit updated seen.json
        run: |
          if [ -n "$(git status --porcelain data/seen.json)" ]; then
            git config user.name "dermatest-notifier-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/seen.json
            git commit -m "Update seen studies"
            git push
          else
            echo "Keine Änderungen an seen.json."
          fi
