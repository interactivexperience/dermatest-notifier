name: Diagnose Dermatest detail page structure

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL einer Studien-Detailseite (https://dermatest.com/de/studien/...)"
        required: true
        default: "https://dermatest.com/de/studien/"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: node scripts/diagnose-detail.mjs "${{ inputs.url }}"
